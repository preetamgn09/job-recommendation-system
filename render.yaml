# ══════════════════════════════════════════════════════════════
# Render Blueprint — JobFlow AI Deployment
# Deploy all services with one click: https://render.com/deploy
# ══════════════════════════════════════════════════════════════

services:
  # ── API Gateway (Frontend + Reverse Proxy) ──────────────────
  - type: web
    name: jobflow-api-gateway
    runtime: docker
    dockerfilePath: api-gateway/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: USER_SERVICE_URL
        sync: false
      - key: JOB_SERVICE_URL
        sync: false
      - key: RECOMMENDATION_SERVICE_URL
        sync: false
      - key: RABBITMQ_URL
        sync: false

  # ── User Service ────────────────────────────────────────────
  - type: web
    name: jobflow-user-service
    runtime: docker
    dockerfilePath: user-service/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    envVars:
      - key: MONGO_URL
        sync: false
      - key: MONGO_DB
        value: job_recommendation
      - key: REDIS_URL
        sync: false
      - key: RABBITMQ_URL
        sync: false

  # ── Job Service ─────────────────────────────────────────────
  - type: web
    name: jobflow-job-service
    runtime: docker
    dockerfilePath: job-service/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    envVars:
      - key: MONGO_URL
        sync: false
      - key: MONGO_DB
        value: job_recommendation
      - key: REDIS_URL
        sync: false

  # ── Recommendation Service ──────────────────────────────────
  - type: web
    name: jobflow-recommendation-service
    runtime: docker
    dockerfilePath: recommendation-service/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    envVars:
      - key: MONGO_URL
        sync: false
      - key: MONGO_DB
        value: job_recommendation
      - key: REDIS_URL
        sync: false
      - key: USER_SERVICE_URL
        sync: false
      - key: JOB_SERVICE_URL
        sync: false

  # ── Event Service (Background Worker) ───────────────────────
  - type: worker
    name: jobflow-event-service
    runtime: docker
    dockerfilePath: event-service/Dockerfile
    dockerContext: .
    plan: free
    envVars:
      - key: MONGO_URL
        sync: false
      - key: MONGO_DB
        value: job_recommendation
      - key: REDIS_URL
        sync: false
      - key: RABBITMQ_URL
        sync: false
      - key: RECOMMENDATION_SERVICE_URL
        sync: false
